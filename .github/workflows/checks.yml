name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SLOT: "0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # The same commands as on a laptop: only Docker and make are needed.
      - run: make check
      - run: make e2e
      - if: failure()
        run: docker compose logs --no-color web
      - if: always()
        run: make down
