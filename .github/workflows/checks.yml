name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# The same commands as on a laptop (only Docker and make are needed), split over runners:
# `make ci` is `make check` then the end-to-end tests, here they run side by side.
jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SLOT: "0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: make check SLOT=0
      - if: failure()
        run: docker compose logs --no-color web
      - if: always()
        run: make down SLOT=0

  e2e:
    name: e2e ${{ matrix.shard }}/4
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      # Every shard runs to the end: one failure does not hide the others'.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      SLOT: "0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # `make e2e` installs and builds on its own, then runs this shard of the tests.
      - run: make e2e SLOT=0 ARGS="--shard=${{ matrix.shard }}/4"
      - if: failure()
        run: docker compose logs --no-color web
      - if: always()
        run: make down SLOT=0

  # The check the merge reads. It runs whatever happened upstream: a required job that is
  # skipped counts as passed on GitHub, so anything but `success` fails here.
  checks:
    if: always()
    needs: [static, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needs: $RESULTS"
          [ -n "$RESULTS" ] || exit 1
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
