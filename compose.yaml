# One Compose project per slot: its own Node, its own Postgres, its own volumes.
# Nothing runs on the host; the Makefile is the entry point.
name: fullcar-slot${SLOT:-0}

# Containers run as the host user, so files they write in the repo stay the host's.
x-node: &node
  image: node:24.21.0-bookworm-slim
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  working_dir: /app
  volumes:
    - .:/app
  environment: &node-env
    DATABASE_URL: postgres://fullcar:fullcar@db:5432/fullcar
    TEST_DATABASE_URL: postgres://fullcar:fullcar@db:5432/fullcar_test
    MIGRATIONS_TEST_DATABASE_URL: postgres://fullcar:fullcar@db:5432/fullcar_migrations_test
    NEXT_TELEMETRY_DISABLED: "1"
    HOME: /tmp
    # Empty locally, "true" in CI: Vitest and Playwright then refuse `.only`.
    CI: ${CI:-}

services:
  web:
    <<: *node
    # `dev` (next dev) for `make up`, `start` (next start, the production build) for `make e2e` and `make shot`.
    command: npm run ${WEB_SCRIPT:-dev} -- --hostname 0.0.0.0 --port 3000
    environment:
      <<: *node-env
      # UTC by default, as on Vercel; another zone for `make e2e` and `make shot` (see the Makefile).
      TZ: ${WEB_TZ:-UTC}
      # The slot's fake Photon, never the public one; without a breaker, so that one test's
      # 429 or 500 does not leave the others without suggestions.
      PHOTON_URL: http://photon:2322/api/
      PLACES_BREAKER_MS: "0"
    ports:
      # Loopback only: the slot's app and data are not offered to the local network.
      - "127.0.0.1:30${SLOT:-0}0:3000"
    depends_on:
      db:
        condition: service_healthy
      photon:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 5s

  # A fake of Photon's API (e2e/fake-photon.mjs), empty unless a test sets a text on its
  # control port. Reached only by name inside the slot: no port is published on the host.
  photon:
    <<: *node
    command: node e2e/fake-photon.mjs
    environment: {}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:2323/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 1s
      timeout: 3s
      retries: 30

  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: fullcar
      POSTGRES_PASSWORD: fullcar
      POSTGRES_DB: fullcar
    volumes:
      - db:/var/lib/postgresql
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # Over TCP: the entrypoint's temporary init server only listens on the Unix socket,
      # so it cannot report healthy before `fullcar_test` exists.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "fullcar", "-d", "fullcar_test"]
      interval: 1s
      timeout: 3s
      retries: 30

  e2e:
    image: mcr.microsoft.com/playwright:v1.64.0-noble
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /app
    volumes:
      - .:/app
    environment:
      BASE_URL: http://web:3000
      # The app's database, where the fixtures seed what a test reads (e2e/fixtures.ts).
      DATABASE_URL: postgres://fullcar:fullcar@db:5432/fullcar
      # The fake Photon's control port (e2e/photon.ts).
      PHOTON_CONTROL_URL: http://photon:2323
      HOME: /tmp
      CI: ${CI:-}
    # `make e2e` serves `web` with --no-deps: running `e2e` is what starts the fake Photon.
    depends_on:
      photon:
        condition: service_healthy
    ipc: host
    profiles: [tools]

volumes:
  db:
